<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f3ee">
<meta name="robots" content="noindex">
<title>页面不存在 · The Epub AI Assistant</title>
<link rel="icon" type="image/svg+xml" href="/epub-ai/icon.svg">
<style>
  :root {
    color-scheme: light;
    --bg: #f7f3ee; --surface: #ffffff; --line: #e5e7eb;
    --text: #201a17; --muted: #6b7280; --accent: #e3120b; --accent-soft: rgba(143, 29, 20, .07);
    --serif: "Iowan Old Style", Charter, Georgia, "Songti SC", "Noto Serif SC", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #17130f; --surface: #221c18; --line: rgba(255, 255, 255, .1);
      --text: #f4efea; --muted: #a89c92; --accent: #e3120b; --accent-soft: rgba(227, 18, 11, .16);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    padding: 32px;
    background:
      radial-gradient(60% 60% at 20% 10%, var(--accent-soft), transparent 70%),
      var(--bg);
    color: var(--text);
    font: 400 16px/1.7 var(--sans);
    text-align: center;
  }
  .card {
    max-width: 30rem;
    padding: 40px 34px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--surface);
    box-shadow: 0 24px 60px -34px rgba(0, 0, 0, .5);
  }
  img, svg.mark { width: 56px; height: 56px; border-radius: 14px; display: inline-block; }
  h1 { margin: 20px 0 0; font: 600 clamp(24px, 6vw, 32px)/1.2 var(--serif); letter-spacing: -.01em; }
  p { margin: 14px 0 0; color: var(--muted); font-size: 15px; }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; opacity: .8; }
  a {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 26px; height: 44px; padding: 0 22px;
    border-radius: 12px;
    background: #8f1d14; color: #fff;
    font-size: 15px; font-weight: 600; text-decoration: none;
  }
</style>
</head>
<body>
  <main class="card">
    <svg class="mark" viewBox="0 0 128 128" role="img" aria-label="The Epub AI Assistant">
  <defs>
    <linearGradient id="bg" x1="18" y1="12" x2="110" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6a4d"/>
      <stop offset="0.55" stop-color="#e3120b"/>
      <stop offset="1" stop-color="#82110d"/>
    </linearGradient>
    <linearGradient id="page" x1="29" y1="28" x2="82" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f3eadf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#6d120e" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)"/>
  <path d="M64 18c17 0 31 4 42 10v72c-11-6-25-10-42-10s-31 4-42 10V28c11-6 25-10 42-10Z" fill="#000" opacity=".12"/>

  <g filter="url(#shadow)">
    <path d="M64 28c14.5 0 26.8 3.2 37 8.2v56.8C90.8 88 78.5 85 64 85c-14.4 0-27.2 3.1-37 8.2V36.2C36.8 31.2 49.6 28 64 28Z" fill="url(#page)"/>
    <path d="M64 28v57" stroke="#d5c3ae" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M34 41.5c7.5-3.2 16-4.9 25.5-5.2" stroke="#d94b36" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M34 53c7.5-3.2 16-4.9 25.5-5.2" stroke="#d94b36" stroke-width="4.5" stroke-linecap="round" opacity=".9"/>
    <path d="M34 64.5c7.5-3.2 16-4.9 25.5-5.2" stroke="#d94b36" stroke-width="4.5" stroke-linecap="round" opacity=".78"/>
    <path d="M68.5 38.5c8.7.4 16.8 2.1 24.5 5" stroke="#b7ab9e" stroke-width="4" stroke-linecap="round"/>
    <path d="M68.5 50c8.7.4 16.8 2.1 24.5 5" stroke="#b7ab9e" stroke-width="4" stroke-linecap="round" opacity=".9"/>
    <path d="M68.5 61.5c8.7.4 16.8 2.1 24.5 5" stroke="#b7ab9e" stroke-width="4" stroke-linecap="round" opacity=".78"/>
  </g>

  <g transform="translate(88 27)">
    <circle cx="0" cy="0" r="14" fill="#fff3cf"/>
    <path d="M0-10 2.9-2.9 10 0 2.9 2.9 0 10 -2.9 2.9 -10 0 -2.9-2.9Z" fill="#e3120b"/>
    <circle cx="0" cy="0" r="3.2" fill="#fff3cf"/>
  </g>

  <path d="M28 94c10-4.8 22.2-7.4 36-7.4S90 89.2 100 94" fill="none" stroke="#fff" stroke-opacity=".42" stroke-width="2.5" stroke-linecap="round"/>
</svg>
    <h1>这一页没有书</h1>
    <p class="code">404 — page not found</p>
    <p>地址可能改了，或者你手输了一个不存在的路径。<br>回到宣传页继续。<span class="code">This page does not exist.</span></p>
    <a id="home" href="/epub-ai/">回到首页 <span aria-hidden="true">→</span></a>
  </main>
<script>
  /* GitHub Pages 项目站点下用绝对路径；本地在根目录起服务时退回相对路径。 */
  if (location.pathname.indexOf('/epub-ai/') === -1) {
    var home = document.getElementById("home");
    if (home) home.setAttribute("href", "./");
  }
</script>
</body>
</html>
