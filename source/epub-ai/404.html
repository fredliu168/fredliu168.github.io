<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3f7f6">
<meta name="robots" content="noindex">
<title>页面不存在 · The Epub AI Assistant</title>
<link rel="icon" type="image/svg+xml" href="/epub-ai/icon.svg">
<style>
  :root {
    color-scheme: light;
    --bg: #f3f7f6; --surface: #ffffff; --line: #e5e7eb;
    --text: #163b37; --muted: #6b7280; --accent: #0f766e; --accent-soft: rgba(15, 118, 110, .07);
    --serif: "Iowan Old Style", Charter, Georgia, "Songti SC", "Noto Serif SC", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #101e1c; --surface: #19302b; --line: rgba(255, 255, 255, .1);
      --text: #edf7f2; --muted: #9fbcb0; --accent: #0f766e; --accent-soft: rgba(15, 118, 110, .16);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    padding: 32px;
    background:
      radial-gradient(60% 60% at 20% 10%, var(--accent-soft), transparent 70%),
      var(--bg);
    color: var(--text);
    font: 400 16px/1.7 var(--sans);
    text-align: center;
  }
  .card {
    max-width: 30rem;
    padding: 40px 34px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--surface);
    box-shadow: 0 24px 60px -34px rgba(0, 0, 0, .5);
  }
  img, svg.mark { width: 56px; height: 56px; border-radius: 14px; display: inline-block; }
  h1 { margin: 20px 0 0; font: 600 clamp(24px, 6vw, 32px)/1.2 var(--sans); letter-spacing: -.01em; }
  p { margin: 14px 0 0; color: var(--muted); font-size: 15px; }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; opacity: .8; }
  a {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 26px; height: 44px; padding: 0 22px;
    border-radius: 12px;
    background: #0f766e; color: #fff;
    font-size: 15px; font-weight: 600; text-decoration: none;
  }
</style>
</head>
<body>
  <main class="card">
    <img src="icon.svg" alt="The Epub AI Assistant">
    <h1>这一页没有书</h1>
    <p class="code">404 — page not found</p>
    <p>地址可能改了，或者你手输了一个不存在的路径。<br>回到宣传页继续。<span class="code">This page does not exist.</span></p>
    <a id="home" href="/epub-ai/">回到首页 <span aria-hidden="true">→</span></a>
  </main>
<script>
  /* GitHub Pages 项目站点下用绝对路径；本地在根目录起服务时退回相对路径。 */
  if (location.pathname.indexOf('/epub-ai/') === -1) {
    var home = document.getElementById("home");
    if (home) home.setAttribute("href", "./");
  }
</script>
</body>
</html>
